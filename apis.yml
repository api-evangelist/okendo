apis:
- name: Okendo Merchant REST API
  description: >-
    Server-side Enterprise REST API for managing reviews (list/get/update/reply),
    review groups, customers and profiles, loyalty (rules, transactions, VIP
    tiers, coupons), survey and quiz responses, translation settings and webhook
    subscriptions. Authenticated with HTTP Basic and a dated okendo-api-version
    header.
  humanURL: https://docs.okendo.io/merchant-rest-api
  baseURL: https://api.okendo.io/enterprise
