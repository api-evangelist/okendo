  - type: Authentication
    url: authentication/okendo-authentication.yml
- name: Okendo Storefront REST API
  description: >-
    Public, unauthenticated read API (scoped by okendo_user_id in the path) for
    displaying published reviews, review aggregates, review media, AI review
    summaries/keywords and product questions across products, collections and the
    whole store.
  humanURL: https://docs.okendo.io/on-site/storefront-rest-api
