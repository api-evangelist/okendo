aid: okendo
name: Okendo
description: >-
  Okendo is a customer-marketing platform for ecommerce brands, centered on the
  Shopify ecosystem, that unifies product reviews and ratings, loyalty programs,
  referrals, quizzes and surveys to drive conversion and repeat purchases. For
  developers Okendo exposes two REST surfaces: a server-side Merchant (Enterprise)
  REST API (https://api.okendo.io/enterprise, HTTP Basic auth plus a dated
  okendo-api-version header) for reviews moderation, loyalty, customers, surveys,
  quizzes, settings and webhook management; and a public Storefront REST API for
  reading published reviews, aggregates, media and Q&A. It also ships embeddable
  on-site widgets, a Storefront Javascript API, and first-party Vue and Shopify
  Hydrogen component packages, plus a webhook event stream across reviews,
  loyalty, surveys, quizzes and referrals.
